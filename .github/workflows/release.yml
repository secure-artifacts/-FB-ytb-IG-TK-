name: Release Extension

on:
  push:
    tags:
      - 'v*' # 仅在打版本标签时严格触发

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 打包插件文件
      - name: Package Chrome Extension
        run: |
          mkdir -p dist
          zip -r dist/extension.zip manifest.json background.js content.css content.js icon.png popup.html popup.js apps_script.gs

      # 2. 生成对应当前 Tag 的构件证明
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/extension.zip'

      # 3. 自动创建/更新 Release 并挂载压缩包
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
